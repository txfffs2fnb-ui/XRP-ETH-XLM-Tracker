<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XRP-ETH-XLM Live Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .crypto-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: transform 0.3s ease;
        }
        .crypto-card:hover { transform: translateY(-5px); }
        .crypto-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .crypto-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.2);
        }
        .crypto-name { font-size: 1.5em; font-weight: 600; }
        .price {
            font-size: 2.5em;
            font-weight: bold;
            margin: 15px 0;
        }
        .change {
            font-size: 1.2em;
            padding: 8px 15px;
            border-radius: 10px;
            display: inline-block;
        }
        .positive { background: rgba(76, 175, 80, 0.3); color: #4caf50; }
        .negative { background: rgba(244, 67, 54, 0.3); color: #f44336; }
        .stats { margin-top: 20px; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .loading {
            text-align: center;
            font-size: 1.2em;
            margin: 50px 0;
        }
        .last-update {
            text-align: center;
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Live Krypto-Tracker</h1>
        <div id="loading" class="loading">Lade Live-Daten...</div>
        <div id="content" style="display:none;">
            <div class="crypto-grid" id="cryptoGrid"></div>
            <div class="chart-container">
                <h2 style="margin-bottom: 20px;">📊 Preisentwicklung (24h)</h2>
                <canvas id="priceChart"></canvas>
            </div>
            <div class="last-update" id="lastUpdate"></div>
        </div>
    </div>
    <script>
        const cryptos = ['bitcoin', 'ethereum', 'ripple', 'stellar'];
        const cryptoNames = { bitcoin: 'Bitcoin', ethereum: 'Ethereum', ripple: 'XRP', stellar: 'Stellar (XLM)' };
        const cryptoIcons = { bitcoin: '₿', ethereum: 'Ξ', ripple: 'X', stellar: '✦' };
        let priceHistory = { bitcoin: [], ethereum: [], ripple: [], stellar: [] };
        let timeLabels = [];
        let chart;

        async function fetchCryptoPrices() {
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${cryptos.join(',')}&vs_currencies=usd,eur&include_24hr_change=true&include_24hr_vol=true&include_market_cap=true`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                return null;
            }
        }

        function createCryptoCard(cryptoId, data) {
            const name = cryptoNames[cryptoId];
            const icon = cryptoIcons[cryptoId];
            const price = data.usd.toFixed(cryptoId === 'ripple' || cryptoId === 'stellar' ? 4 : 2);
            const priceEur = data.eur.toFixed(cryptoId === 'ripple' || cryptoId === 'stellar' ? 4 : 2);
            const change = data.usd_24h_change.toFixed(2);
            const isPositive = change >= 0;
            const vol = (data.usd_24h_vol / 1000000).toFixed(2);
            const mcap = (data.usd_market_cap / 1000000000).toFixed(2);

            return `
                <div class="crypto-card">
                    <div class="crypto-header">
                        <div class="crypto-icon">${icon}</div>
                        <div class="crypto-name">${name}</div>
                    </div>
                    <div class="price">$${price}</div>
                    <div class="price" style="font-size:1.5em; opacity:0.8;">€${priceEur}</div>
                    <div class="change ${isPositive ? 'positive' : 'negative'}">
                        ${isPositive ? '▲' : '▼'} ${Math.abs(change)}%
                    </div>
                    <div class="stats">
                        <div class="stat-row">
                            <span>24h Volumen:</span>
                            <span>$${vol}M</span>
                        </div>
                        <div class="stat-row">
                            <span>Marktkapitalisierung:</span>
                            <span>$${mcap}B</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateChart() {
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [
                        { label: 'Bitcoin', data: priceHistory.bitcoin, borderColor: '#f7931a', tension: 0.4 },
                        { label: 'Ethereum', data: priceHistory.ethereum, borderColor: '#627eea', tension: 0.4 },
                        { label: 'XRP', data: priceHistory.ripple, borderColor: '#23292f', tension: 0.4 },
                        { label: 'Stellar', data: priceHistory.stellar, borderColor: '#14b6ff', tension: 0.4 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#fff' }, grid: { color: 'rgba(255,255,255,0.1)' } }
                    }
                }
            });
        }

        async function updateData() {
            const data = await fetchCryptoPrices();
            if (!data) return;

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            const grid = document.getElementById('cryptoGrid');
            grid.innerHTML = cryptos.map(id => createCryptoCard(id, data[id])).join('');

            const now = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            timeLabels.push(now);
            if (timeLabels.length > 20) timeLabels.shift();

            cryptos.forEach(id => {
                priceHistory[id].push(data[id].usd);
                if (priceHistory[id].length > 20) priceHistory[id].shift();
            });

            updateChart();
            document.getElementById('lastUpdate').textContent = `Letztes Update: ${new Date().toLocaleString('de-DE')}`;
        }

        updateData();
        setInterval(updateData, 30000);
    </script>
</body>
</html>
